<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace | imMBA Fu Jen</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="marketplace">
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker" style="color:var(--gold)">Marketplace</p>
        <h1 data-en>Books and course materials.</h1>
        <h1 data-zh>書籍與課程教材。</h1>
        <p class="lede" data-en>Browse active listings from every seller without an account. Sign in with the existing campus login to add items to your cart or place an order.</p>
        <p class="lede" data-zh>無需帳號即可瀏覽各賣家的上架商品。加入購物車或下單時請使用現有校園登入。</p>
        <div data-market-chrome></div>
        <p class="status hidden" data-market-status hidden></p>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <form class="admin-toolbar market-browse-bar" data-browse-filters>
          <label>
            <span data-en>Search</span>
            <span data-zh>搜尋</span>
            <input name="q" type="search" placeholder="Product name">
          </label>
          <label>
            <span data-en>Category</span>
            <span data-zh>類別</span>
            <select name="category">
              <option value="">All categories</option>
            </select>
          </label>
          <label>
            <span data-en>Sort</span>
            <span data-zh>排序</span>
            <select name="sort">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </form>
        <div class="hidden" data-product-detail hidden></div>
        <div class="grid-3" data-product-grid></div>
      </div>
    </section>
  </main>
  <script src="/js/data.js?v=20261116a"></script>
  <script src="/js/site.js?v=20261116a"></script>
  <script type="module" src="/src/marketplace.js"></script>
</body>
</html>
