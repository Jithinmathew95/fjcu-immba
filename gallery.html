<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | imMBA Fu Jen</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery">
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker" style="color:var(--gold)">Gallery</p>
        <h1 data-en>Life in the programme.</h1>
        <h1 data-zh>學程生活。</h1>
        <p class="prose" data-en>Editorial panels stand in for campus photography. Replace these with official photos when the office provides licensed images.</p>
        <p class="prose" data-zh>以下為版面示意，待辦公室提供授權照片後即可替換。</p>
      </div>
    </header>
    <section class="section">
      <div class="wrap gallery">
        <figure class="photo"><div class="swatch swatch-1"></div><figcaption data-en>International classroom</figcaption><figcaption data-zh>國際化課堂</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-2"></div><figcaption data-en>Partner visit, Spain</figcaption><figcaption data-zh>西班牙合作校</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-3"></div><figcaption data-en>Campus, Xinzhuang</figcaption><figcaption data-zh>新莊校園</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-4"></div><figcaption data-en>Info session</figcaption><figcaption data-zh>招生說明會</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-5"></div><figcaption data-en>KEDGE pathway</figcaption><figcaption data-zh>KEDGE 雙聯</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-6"></div><figcaption data-en>Thesis milestone</figcaption><figcaption data-zh>論文里程碑</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-7"></div><figcaption data-en>English corner</figcaption><figcaption data-zh>英語角落</figcaption></figure>
        <figure class="photo"><div class="swatch swatch-8"></div><figcaption data-en>Alumni abroad</figcaption><figcaption data-zh>海外校友</figcaption></figure>
      </div>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
