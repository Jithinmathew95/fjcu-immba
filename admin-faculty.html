<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdminFaculty | imMBA Fu Jen</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin-faculty">
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker" style="color:var(--gold)">Back-office · AdminFaculty</p>
        <h1 data-en>Faculty cabinet</h1>
        <h1 data-zh>師資櫃</h1>
        <p class="lede">
          <a class="link-internal" href="admin.html">Admin home</a>
          ·
          <span data-en>Signed in as</span>
          <strong data-admin-email></strong>
          <button type="button" class="btn btn-line" data-logout>Sign out</button>
        </p>
        <p class="status hidden" data-admin-status hidden></p>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <div class="admin-toolbar">
          <button type="button" class="btn btn-line" data-migrate-photos>Move local portraits into Storage</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Photo</th>
                <th>Name</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody data-faculty-table></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <form class="form admin-form" data-faculty-form>
          <input type="hidden" name="id">
          <div class="admin-form-grid">
            <label>English name <input name="name" required></label>
            <label>Chinese name <input name="nameZh"></label>
            <label>English title <input name="roleEn"></label>
            <label>Chinese title <input name="roleZh"></label>
            <label>English department <input name="department"></label>
            <label>Chinese department <input name="departmentZh"></label>
            <label>English education <input name="eduEn"></label>
            <label>Chinese education <input name="eduZh"></label>
            <label class="span-2">English research fields <input name="specEn"></label>
            <label class="span-2">Chinese research fields <input name="specZh"></label>
            <label>Email <input name="email" type="email"></label>
            <label>Phone / office <input name="tel"></label>
            <label>Website <input name="web" type="url" placeholder="https://"></label>
            <label>Sort order <input name="order" type="number" min="1"></label>
            <label>Category
              <select name="category">
                <option value="full-time">full-time</option>
                <option value="part-time">part-time</option>
              </select>
            </label>
            <label>Photo URL <input name="photo"></label>
            <label class="span-2">Upload photo (JPG, PNG, or WebP, max 2 MB)
              <input name="photoFile" type="file" accept="image/jpeg,image/png,image/webp">
            </label>
          </div>
          <div class="admin-toolbar">
            <button class="btn btn-navy" type="submit">Save faculty</button>
            <button class="btn btn-line" type="button" data-faculty-reset>New person</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="/js/data.js?v=20261116a"></script>
  <script src="/js/site.js?v=20261117b"></script>
  <script type="module" src="/src/admin-faculty.js"></script>
</body>
</html>
