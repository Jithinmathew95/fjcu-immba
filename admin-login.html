<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign-in | imMBA Fu Jen</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin-login">
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker" style="color:var(--gold)">Back-office</p>
        <h1 data-en>Staff sign-in</h1>
        <h1 data-zh>同仁登入</h1>
        <p class="lede" data-en>Sign-in for site staff who edit Faculty and News. Shopping or selling? Use the <a class="lede-market-link" href="marketplace.html">Marketplace</a>.</p>
        <p class="lede" data-zh>供編輯師資與消息的網站同仁登入。購物或販售請使用<a class="lede-market-link" href="marketplace.html">市集</a>。</p>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <div class="admin-login">
          <p class="lede" data-login-checking>
            <span data-en>Checking sign-in…</span>
            <span data-zh>正在確認登入…</span>
          </p>
          <div class="hidden" data-login-ready hidden>
          <p class="status hidden" data-login-status hidden></p>
          <form class="form card" data-login-form data-auth-panel="login">
            <h2 data-en>Sign in</h2>
            <h2 data-zh>登入</h2>
            <label>
              <span data-en>Email</span>
              <span data-zh>電子郵件</span>
              <input name="email" type="email" autocomplete="username" required>
            </label>
            <label>
              <span data-en>Password</span>
              <span data-zh>密碼</span>
              <span class="password-field">
                <input name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
              </span>
            </label>
            <button class="btn btn-navy" type="submit">
              <span data-en>Sign in</span>
              <span data-zh>登入</span>
            </button>
            <p class="admin-auth-links">
              <button type="button" class="btn btn-line" data-auth-show="register">
                <span data-en>Register</span>
                <span data-zh>註冊</span>
              </button>
              <button type="button" class="btn btn-line" data-auth-show="forgot">
                <span data-en>Forgot password</span>
                <span data-zh>忘記密碼</span>
              </button>
            </p>
          </form>
          <form class="form card hidden" data-register-form data-auth-panel="register" hidden>
            <h2 data-en>Register</h2>
            <h2 data-zh>註冊</h2>
            <label>
              <span data-en>Email</span>
              <span data-zh>電子郵件</span>
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
              <span data-en>Password</span>
              <span data-zh>密碼</span>
              <span class="password-field">
                <input name="password" type="password" autocomplete="new-password" required minlength="8">
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
              </span>
            </label>
            <label>
              <span data-en>Confirm password</span>
              <span data-zh>確認密碼</span>
              <span class="password-field">
                <input name="confirm" type="password" autocomplete="new-password" required minlength="8">
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
              </span>
            </label>
            <button class="btn btn-navy" type="submit">
              <span data-en>Create pending account</span>
              <span data-zh>建立待審核帳號</span>
            </button>
            <p>
              <button type="button" class="btn btn-line" data-auth-show="login">
                <span data-en>Back to sign-in</span>
                <span data-zh>返回登入</span>
              </button>
            </p>
          </form>
          <form class="form card hidden" data-forgot-form data-auth-panel="forgot" hidden>
            <h2 data-en>Forgot password</h2>
            <h2 data-zh>忘記密碼</h2>
            <label>
              <span data-en>Email</span>
              <span data-zh>電子郵件</span>
              <input name="email" type="email" required>
            </label>
            <button class="btn btn-navy" type="submit">
              <span data-en>Send reset email</span>
              <span data-zh>寄送重設信件</span>
            </button>
            <p>
              <button type="button" class="btn btn-line" data-auth-show="login">
                <span data-en>Back to sign-in</span>
                <span data-zh>返回登入</span>
              </button>
            </p>
          </form>
          <form class="form card hidden" data-reset-form data-auth-panel="reset" hidden>
            <h2 data-en>Set a new password</h2>
            <h2 data-zh>設定新密碼</h2>
            <label>
              <span data-en>New password</span>
              <span data-zh>新密碼</span>
              <span class="password-field">
                <input name="password" type="password" autocomplete="new-password" required minlength="8">
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
              </span>
            </label>
            <label>
              <span data-en>Confirm password</span>
              <span data-zh>確認密碼</span>
              <span class="password-field">
                <input name="confirm" type="password" autocomplete="new-password" required minlength="8">
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
              </span>
            </label>
            <button class="btn btn-navy" type="submit">
              <span data-en>Update password</span>
              <span data-zh>更新密碼</span>
            </button>
          </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/data.js?v=20261116a"></script>
  <script src="/js/site.js?v=20261119d"></script>
  <script type="module" src="/src/admin-login.js"></script>
</body>
</html>
